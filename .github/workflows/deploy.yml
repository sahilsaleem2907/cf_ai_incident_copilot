# Deploys main after a merge (TDD §15): checks, D1 migrations, build, demo Worker first (the main Worker's
# DEMO binding needs it), main Worker, then a smoke test that uses no LLM.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.main.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: d1 migrations apply DB --remote

      # Writes both Workers to dist/ and .wrangler/deploy/config.json, which points `wrangler deploy` at the main one.
      - run: pnpm build

      - name: Deploy the demo Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy -c dist/incident_copilot_demo/wrangler.json

      - name: Deploy the main Worker
        id: main
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy

      # The URL comes from wrangler's output; the APP_URL repository variable is a fallback if it can't be read.
      - name: Smoke test
        run: node scripts/smoke.ts "$APP_URL"
        env:
          APP_URL: ${{ steps.main.outputs.deployment-url || vars.APP_URL }}
